name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run Go tests
        run: go test ./...

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build Windows executable
        run: wails build -clean -webview2 embed

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/bin/go-script-sql-runner.exe')) {
            throw 'Expected build/bin/go-script-sql-runner.exe was not produced.'
          }

      - name: Upload generated lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: generated-lockfiles
          path: |
            go.sum
            frontend/package-lock.json
          if-no-files-found: error
