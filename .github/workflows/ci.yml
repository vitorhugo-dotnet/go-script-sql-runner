name: CI / Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download Go dependencies
        run: go mod download

      - name: Run Go tests
        run: go test ./...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests when configured
        working-directory: frontend
        run: npm test --if-present

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc -b

  build:
    name: Build Windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download Go dependencies
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Setup .NET SDK for WiX
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WiX Toolset 7 and UI extension
        shell: pwsh
        run: |
          $wixVersion = '7.0.0'
          $wixDirectory = Join-Path $env:TEMP "go-script-sql-runner-tools\wix\$wixVersion"
          New-Item -ItemType Directory -Path $wixDirectory -Force | Out-Null
          dotnet tool install wix --version $wixVersion --tool-path $wixDirectory --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install pinned WiX Toolset 7.0.0.' }

          $env:WIX_EXTENSION = Join-Path $env:RUNNER_TEMP 'go-script-sql-runner-wix-extensions-7.0.0'
          "WIX_EXTENSION=$env:WIX_EXTENSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $wixDirectory 'wix.exe') extension add --global 'WixToolset.UI.wixext/7.0.0' -acceptEula wix7
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install pinned WiX UI extension 7.0.0.' }

      - name: Build executable
        run: wails build -clean -webview2 embed -windowsconsole -ldflags "-X main.currentBuildTag=build-${{ github.run_number }}" -o go-script-sql-runner-portable.exe

      - name: Build MSI installer
        shell: pwsh
        run: |
          ./scripts/build-windows-installer.ps1 `
            -AppVersion '0.1.${{ github.run_number }}' `
            -ExecutablePath 'build/bin/go-script-sql-runner-portable.exe' `
            -OutputDirectory 'build/bin'

      - name: Verify Windows release files
        shell: pwsh
        run: |
          $expectedFiles = @(
            'build/bin/go-script-sql-runner-portable.exe',
            'build/bin/go-script-sql-runner-setup.msi'
          )
          foreach ($file in $expectedFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Expected release file was not produced: $file"
            }
          }

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: go-script-sql-runner-windows
          path: |
            build/bin/go-script-sql-runner-portable.exe
            build/bin/go-script-sql-runner-setup.msi
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows release files
        uses: actions/download-artifact@v5
        with:
          name: go-script-sql-runner-windows
          path: release

      - name: Verify Windows release files
        shell: bash
        run: |
          set -euo pipefail
          test -f release/go-script-sql-runner-portable.exe
          test -f release/go-script-sql-runner-setup.msi

      - name: Publish Windows release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              'release/go-script-sql-runner-portable.exe#Windows portable executable' \
              'release/go-script-sql-runner-setup.msi#Windows installer (MSI)' \
              --clobber

            gh release edit "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Go Script SQL Runner - Build #${GITHUB_RUN_NUMBER}" \
              --notes "Automated Windows build from main. Commit: ${GITHUB_SHA}" \
              --latest
          else
            gh release create "${RELEASE_TAG}" \
              'release/go-script-sql-runner-portable.exe#Windows portable executable' \
              'release/go-script-sql-runner-setup.msi#Windows installer (MSI)' \
              --target "${GITHUB_SHA}" \
              --title "Go Script SQL Runner - Build #${GITHUB_RUN_NUMBER}" \
              --notes "Automated Windows build from main. Commit: ${GITHUB_SHA}" \
              --latest
          fi
