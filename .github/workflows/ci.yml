name: CI / Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download Go dependencies
        run: go mod download

      - name: Run Go tests
        run: go test ./...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run frontend tests when configured
        working-directory: frontend
        run: npm test --if-present

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc -b

  build:
    name: Build Windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download Go dependencies
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build executable
        run: wails build -clean -webview2 embed -windowsconsole

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/bin/go-script-sql-runner.exe')) {
            throw 'Expected build/bin/go-script-sql-runner.exe was not produced.'
          }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-script-sql-runner-windows
          path: build/bin/go-script-sql-runner.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executable artifact
        uses: actions/download-artifact@v5
        with:
          name: go-script-sql-runner-windows
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "release/go-script-sql-runner.exe#Windows executable"
          --verify-tag
          --generate-notes
          --title "Go Script SQL Runner ${GITHUB_REF_NAME}"
