services:
  mysql56:
    image: public.ecr.aws/docker/library/mysql:5.6.51
    environment:
      MYSQL_ROOT_PASSWORD: runnerpass
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: runner_test
    ports:
      - "3356:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prunnerpass --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mysql57:
    image: public.ecr.aws/docker/library/mysql:5.7.44
